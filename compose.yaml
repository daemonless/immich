#
# Immich for FreeBSD (Daemonless)
#
# Drop-in compatible with official Immich docker-compose.yml
#
# Prerequisites:
#   pkg install podman-suite py311-podman-compose
#
# Usage:
#   1. Copy example.env to .env and edit
#   2. Run: podman-compose up -d
#

name: immich

x-daemonless:
  title: Immich
  icon: ':simple-googlephotos:'
  category: Photos & Media
  description: High performance self-hosted photo and video management solution.
  upstream_url: https://github.com/immich-app/immich
  web_url: https://immich.app/
  type: stack

  appjail:
    director:
      options:
        - alias:
        - ip4_inherit:
      services:
        immich-server:
          name: immich_server
          priority: 100
          options:
            - from: ghcr.io/daemonless/immich-server:latest
          volumes:
            - immich-data: /data
          oci:
            environment:
              - DB_HOSTNAME: 127.0.0.1
              - DB_USERNAME: "!ENV '${DB_USERNAME}'"
              - DB_PASSWORD: "!ENV '${DB_PASSWORD}'"
              - REDIS_HOSTNAME: 127.0.0.1
              - IMMICH_MACHINE_LEARNING_URL: http://127.0.0.1:3003
              - TZ: "!ENV '${TZ}'"
        immich-machine-learning:
          name: immich_machine_learning
          options:
            - from: ghcr.io/daemonless/immich-ml:latest
          oci:
            environment:
              - HF_HOME: /cache/huggingface
              - MPLCONFIGDIR: /tmp
              - TZ: "!ENV '${TZ}'"
          volumes:
            - model-cache: /cache
        redis:
          name: immich_redis
          options:
            - from: ghcr.io/daemonless/redis:latest
          oci:
            environment:
              - LANG: C.UTF-8
              - TZ: "!ENV '${TZ}'"
          volumes:
            - redis-data: /config
        database:
          name: immich_postgres
          options:
            - from: ghcr.io/daemonless/immich-postgres:latest
            - template: "!ENV '${PWD}/immich-postgres-template.conf'"
          oci:
            environment:
              - POSTGRES_PASSWORD: "!ENV '${DB_PASSWORD}'"
              - POSTGRES_USER: "!ENV '${DB_USERNAME}'"
              - POSTGRES_DB: "!ENV '${DB_DATABASE_NAME}'"
          volumes:
            - db-data: /var/lib/postgresql/data
      volumes:
        immich-data:
          device: "!ENV '${UPLOAD_LOCATION}'"
        model-cache:
          device: "!ENV '${CACHE_LOCATION}'"
        redis-data:
          device: "!ENV '${REDIS_DATA_LOCATION}'"
        db-data:
          device: "!ENV '${DB_DATA_LOCATION}'"

  docs:
    manual: true
    env:
      UPLOAD_LOCATION: Path to store uploaded media
      DB_DATA_LOCATION: Path to store database files
      DB_PASSWORD: PostgreSQL database password
      DB_USERNAME: PostgreSQL username
      DB_DATABASE_NAME: PostgreSQL database name
      IMMICH_ML_TAG: Machine learning image tag (defaults to 'latest')
      TZ: Timezone
    volumes:
      /data: Media storage (mapped to UPLOAD_LOCATION)
    ports:
      2283: Web UI

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/daemonless/immich-server:${IMMICH_TAG:-latest}
    network_mode: host
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: localhost
      REDIS_HOSTNAME: localhost
      IMMICH_MACHINE_LEARNING_URL: http://localhost:3003
    env_file:
      - .env
    depends_on:
      - redis
      - database
      - immich-machine-learning
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/daemonless/immich-ml:${IMMICH_ML_TAG:-latest}
    network_mode: host
    environment:
      HF_HOME: /cache/huggingface
      MPLCONFIGDIR: /tmp
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always

  redis:
    container_name: immich_redis
    image: ghcr.io/daemonless/redis:latest
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - redis-data:/config
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/daemonless/immich-postgres:latest
    network_mode: host
    # FreeBSD requires sysvipc for PostgreSQL shared memory
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    restart: always

volumes:
  model-cache:
  redis-data:
